version: '3.8'

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_TEST_DB}

  redis:
    ports:
      - "6379:6379"

  api:
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      NODE_ENV: development
    volumes:
      - ./services/api:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    deploy:
      replicas: 1
